name: Build Blazor and Deploy to Vercel

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend-blazor/**'
      - '.github/workflows/deploy-blazor.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM
        run: dotnet publish frontend-blazor/KeyForge.Frontend/KeyForge.Frontend.csproj -c Release -o frontend-blazor/KeyForge.Frontend/publish

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-blazor/KeyForge.Frontend

      - name: Build Vercel Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-blazor/KeyForge.Frontend

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend-blazor/KeyForge.Frontend